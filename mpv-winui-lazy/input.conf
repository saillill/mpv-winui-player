# =================================================================================================
# 鼠标 & 快捷键区域
# =================================================================================================
MBTN_LEFT       cycle pause                                 #鼠标左键 暂停/播放
MBTN_LEFT_DBL   cycle fullscreen                            #左键双击 切换全屏
MBTN_MID        ignore                                      #鼠标中键 无操作
MBTN_BACK       playlist-prev                               #侧键向前 播放列表上一个
MBTN_FORWARD    playlist-next                               #侧键向后 播放列表下一个
WHEEL_UP        add volume 5                                #滚轮向上 音量+5
WHEEL_DOWN      add volume -5                               #滚轮向下 音量-5
WHEEL_LEFT      seek 2                                      #滚轮向左 向前2秒
WHEEL_RIGHT     seek -2                                     #滚轮向右 向后2秒

ESC             set fullscreen no                           #退出全屏
`               script-binding console/enable               #打开控制台
F3              script-binding input_plus/vf_hold           #临时清空视频滤镜
F4              script-binding input_plus/glsl_hold         #临时清空着色器
F5              script-binding input_plus/af_hold           #临时清空音频滤镜/恢复
F6              show-text ${playlist}                       #显示播放列表
F7              show-text ${track-list}                     #显示轨道信息
,               script-binding input_plus/speed_auto        #按住两倍速 松开一倍速
.               script-binding input_plus/speed_auto_bullet #按住子弹时间 松开一倍速
Ctrl+LEFT       script-binding input_plus/seek_acc          #非线性向前跳转（模拟流媒体平台的跳转方式）
Ctrl+RIGHT      script-binding input_plus/seek_acc_back     #非线性向后跳转

SPACE           cycle pause
F8             playlist-next
F9             playlist-prev
PGUP            add chapter  1
PGDWN           add chapter -1
Alt+.           frame-step
Alt+,           frame-back-step
RIGHT           seek  5 exact
LEFT            seek -5 exact
Alt+RIGHT       seek  300
Alt+LEFT        seek -300
KP8             cycle video
Ctrl+1          add contrast -1
Ctrl+2          add contrast  1
Ctrl+3          add brightness -1
Ctrl+4          add brightness  1
Ctrl+5          add gamma -1
Ctrl+6          add gamma  1
Ctrl+7          add saturation -1
Ctrl+8          add saturation  1
Ctrl+9          add hue -1
Ctrl+0          add hue  1
Ctrl+I          cycle icc-profile-auto
Ctrl+-          add video-zoom -0.1
Ctrl++          add video-zoom  0.1
Ctrl+KP4        add video-pan-x -0.01
Ctrl+KP6        add video-pan-x  0.01
Ctrl+KP8        add video-pan-y -0.01
Ctrl+KP2        add video-pan-y  0.01
Ctrl+BS         set video-zoom 0; set video-pan-x 0; set video-pan-y 0
w               add panscan -0.1
W               add panscan  0.1
KP7             cycle audio
Ctrl+d          add audio-delay  0.1
Ctrl+D          add audio-delay -0.1
j               cycle sub
v               cycle sub-visibility
z               add sub-delay -0.1
Z               add sub-delay  0.1
r               add sub-pos -1
R               add sub-pos +1
Alt+j           cycle secondary-sid
Alt+v           cycle secondary-sub-visibility
Alt+z           add secondary-sub-delay -0.1
Alt+Z           add secondary-sub-delay  0.1
Alt+r           add secondary-sub-pos -1
Alt+R           add secondary-sub-pos +1
F               add sub-scale -0.1
G               add sub-scale  0.1
UP              add volume  2
DOWN            add volume -2
m               cycle mute
[               multiply speed 1/1.1
]               multiply speed 1.1
{               multiply speed 0.5
}               multiply speed 2.0
BS              set speed 1
O               no-osd cycle-values osd-level 3 1
p               show-progress
TAB             script-binding stats/display-stats-toggle
·               script-binding console/enable

Alt+i           script-binding stats_mediainfo/display_toggle
Ctrl+Alt+i      script-binding stats_mediainfo/copy2clipboard
l               ab-loop
L               cycle-values loop-file inf no
Ctrl+h          cycle-values hwdec auto no

