##⇘⇘基本说明：
##没有必要写入和默认值相同的参数，这里只是为了演示说明
##行首存在注释符"#"，代表此项处于屏蔽状态（即未被mpv读取）
##注释内容解释 —— # <可选值> [条件要求] 参数意义说明 （补充）
##部分选项之间有关联作用，MPV读取参数时由上往下读，所以注意书写通用参数的顺序

 input-conf       = "~~/input.conf"          # 使用另外指定的文件作为默认的快捷键方案。默认为空
 include          = "~~/profiles.conf"       # 追加读取额外的设置文件（条件配置组）
 include          = "~~/script-opts.conf"    # 追加读取脚本选项文件
 use-filedir-conf = yes                      # 是否允许使用特定文件的设置文件，默认 no 。建议关闭以保证安全
#log-file         = "~~/mpv.log"    # 默认关闭：mpv 的 --log-file 会把日志级别强制提到 verbose，
                                    # 且 --msg-level 无法把它压低（官方手册说明）。排障时取消注释，
                                    # 并把 msg-level 临时改为 all=v
 msg-level         = all=info


 ########
 # 基础 #
 ########

 vo                 = gpu-next       # <gpu-next|gpu> 视频输出驱动。gpu-next 支持杜比视界等现代特性，首选
 gpu-context        = d3d11          # <win|d3d11|winvk> 图形输出后端。Win&NV 用户应使用 d3d11
 d3d11-output-csp   = srgb           # [d3d11模式] 输出到显示器的色彩空间，srgb=标准色域
 d3d11-exclusive-fs = no             # [d3d11模式] 全屏时独占，默认 no
#d3d11-flip         = yes            # 禁用它可避免全屏时的冻屏问题，默认 yes

 hwdec              = auto-safe      # 指定应使用的硬件视频解码 API。auto-safe 自动选最优方案，不稳定的硬解路径自动回退软解
                                     # 更多详情参见 Wiki 的 FAQ 页面下的“软硬解的选择”部分
#vd-lavc-dr         = auto           # <默认auto|yes|no> 是否直接解码到显存，个别低端英特尔处理器可能需要显式禁用

 hwdec-codecs       = all            # 对限定范围内的编码尝试硬解，特殊值 all 即任意格式都尝试硬解
#d3d11-adapter      = "NVIDIA GeForce RTX 4070 Ti Super"
                                     # [当 --gpu-api=d3d11 时] 指定主渲染显卡。台式机通常无需设置，默认为空
#vulkan-device      = "NVIDIA GeForce RTX 4070 Ti Super"
                                     # [当 --gpu-api=vulkan 时] 指定显卡，须使用完整设备名或UUID
 force-window        = yes           # 强制打开图形窗口（音频文件也显示窗口）


 ########
 # 功能 #
 ########

##⇘⇘一般功能
 idle                   = yes         # <yes|默认no|once> 是否空闲待机（播放完后保持mpv运行）
 input-ime              = yes         # 禁用输入法，防止快捷键触发输入法
 input-ipc-server       = mpvpipe     # IPC 支持（SVP 插帧等外部程序通信）
 input-builtin-bindings = no          # 禁用mpv初始快捷键，只使用 input.conf 中的设定
#input-default-bindings = yes         # 类似上一项，也涉及脚本中预设的弱绑定键位，默认 yes

 pause                  = no          # 是否以暂停状态启动播放器，默认 no
 panscan                = 0.0         # <0.0-1.0> 画面修剪/放大，用于消除黑边
#loop                   = no          # <inf|默认no> 是否循环播放当前文件
 loop-playlist          = yes         # <inf|force|默认no> 播放列表循环
 hr-seek-framedrop      = no          # [补帧时推荐设置为no] 跳转时允许丢帧，默认 yes
 save-position-on-quit  = yes         # 退出时记住播放状态，默认 no
 watch-later-options    = start,vid,aid,sid
                                      # [补帧时注意避免记录 vf] 稍后观看的属性白名单。推荐精简以避免与核心设置冲突

##⇘⇘HDR信号链接与HDR片源直接输出或转SDR
 target-colorspace-hint        = yes           # <默认auto|yes|no> 是否自动切换显示的目标色彩空间。HDR直通需设为 yes
#target-colorspace-hint-mode   = source        # <默认target|source|source-dynamic> 启用上一项时使用的元数据模式。直通选 source
#target-colorspace-hint-strict = yes           # <默认yes|no> 是否遵循 --target-* 选项

##⇘⇘自动播放列表 —— 打开单个文件时自动添加当前路径下其它文件到播放列表
 autocreate-playlist    = same         # <默认no|filter|same> filter=按类型过滤填充，same=仅填充同类文件
 directory-mode         = ignore       # <默认auto|lazy|recursive|ignore> 打开目录时子文件夹的处理模式。推荐 ignore
 directory-filter-types = video,audio  # <video,audio,image,archive,playlist> 限制填充的文件类型
 video-exts             = 3g2,3gp,avi,flv,m2ts,m4v,mj2,mkv,mov,mp4,mpeg,mpg,ogv,rmvb,ts,webm,wmv,y4m,rm
                                       # 限制填充文件类型对应的扩展名白名单，下方二项同理
 image-exts             = avif,bmp,gif,heic,heif,j2k,jp2,jpeg,jpg,jxl,png,qoi,svg,tga,tif,tiff,webp
 audio-exts             = aac,ac3,aiff,ape,au,dts,eac3,flac,m4a,mka,mp3,oga,ogg,ogm,opus,thd,wav,wma,wv

##⇘⇘窗口相关
 keep-open              = yes          # <yes|默认no|always> 播完列表暂停。yes=列表播完暂停
#fs                     = no           # 运行MPV自动进入全屏，默认 no
#ontop                  = no           # 窗口置顶，默认 no
 title-bar              = yes          # 显示WINDOWS的窗口装饰（边框），默认 yes
 geometry               =              # 设定初始位置或尺寸，附带锁定窗口比例。例值 1280x720 或 50%x50%
#auto-window-resize     = yes          # <默认yes|no> 是否允许自动调节窗口大小。启用将无效化 --autofit 系列和 --window-scale
 autofit-smaller        = 50%x50%      # 窗口自动拉伸时防止太小。例值 40%x40%
 keepaspect             = yes          # 按源比例拉伸视频（yes），变形画面至窗口形状（no）
 keepaspect-window      = yes          # 窗口比例锁定为视频比例。no=窗口自由拉伸
#hidpi-window-scale     = yes          # <yes|默认no> 是否执行 HiDPI 缩放。影响 --window-scale 的计算数值


##⇘⇘缓存相关
 cache                  = auto         # <yes|no|默认auto> 是否启用网络缓存（进内存），默认 auto
 demuxer-max-bytes      = 1024MiB      # 网络流缓存大小（KiB或MiB），默认 150MiB
 demuxer-max-back-bytes = 512MiB       # 向后缓存大小（允许回退的量）

 icc-cache              = yes          # 是否在本地存储ICC配置文件的3dlut缓存，默认 yes
 icc-cache-dir          = "~~/_cache/icc"
                                       # 指定ICC配置文件的3dlut缓存目录
 gpu-shader-cache       = yes          # 是否在本地存储GLSL着色器的编译缓存，默认 yes
 gpu-shader-cache-dir   = "~~/_cache/shader"
                                       # 指定GLSL着色器的编译缓存目录
 watch-later-dir        = "~~/_cache/watch_later"
                                       # 稍后观看功能的缓存目录，记录 --watch-later-options 指定的项


##⇘⇘音频文件播放相关
 audio-display          = embedded-first  # 有专辑封面就显示封面，优先内嵌，无则黑屏
 resume-playback        = yes             # 记住播放进度（需配合 save-position-on-quit=yes）
#msg-level              = "cplayer=no,sub/ass=no,display-tags=no"  # 抑制控制台日志输出
#msg-module             = no              # 不显示日志来源模块名


 #######
 # OSD #
 #######

##⇘⇘OSD 即 On-Screen-Display 。 OSC 即 on-screen-controller

 osd-on-seek              = msg           # <no|默认bar|msg|msg-bar> 跳转时显示的信息类型
 osd-duration             = 2000          # 设置（全局）OSD文本信息的持续时间（毫秒），默认 1000
 osd-font                 = "sans-serif"          # OSD 字体，默认 sans-serif
osd-font-size            = 20            # 更改OSD字体大小（全局），默认 30
#osd-playing-msg          = "${filename}" # 每个文件开始播放时显示的信息。${filename}=文件名
#osd-playing-msg-duration = 3000          # --osd-playing-msg 的持续时间，默认(0)使用全局OSD持续时间
 osd-bar                  = no            # 隐藏 mpv 自带音量/进度条渲染
 osd-bar-align-y          = -1            # <-1-1> bar 的垂直位置，默认 0.5
 osd-bar-w                = 100           # <1-100> bar 的宽度（画面百分比），默认 75
 osd-bar-h                = 1.8           # <0.1-50> bar 的高度（画面百分比），默认 3.125
 osd-blur                 = 0             # <0-20.0> 高斯模糊系数，默认 0
 osd-outline-color        = "#000000"     # <格式为(AA)RRGGBB> OSD 轮廓颜色
osd-outline-size         = 0.8           # OSD 轮廓尺寸，默认 1.65
 osd-color                = "#ffffff"     # <格式为(AA)RRGGBB> OSD 颜色
 osd-fractions            = yes           # 以秒为单位显示OSD时间（毫秒精度），默认 no


 ########
 # 音频 #
 ########

 ao                     = wasapi       # 指定音频输出驱动。win10优先使用wasapi
#audio-device           = auto         # 启动时的音频输出设备，默认 auto。例值 "wasapi/{xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx}"
#audio-exclusive        = no           # 音频通道独占，默认 no。其它软件先独占音频通道后再开MPV可能画面卡顿

 volume                 = 100          # 播放器启动音量，默认 100
 volume-max             = 100          # <100.0-1000.0> 最大音量，默认 130
 audio-channels         = auto-safe    # 声道布局，默认 auto-safe。stereo=强制下混为双声道
#audio-pitch-correction = yes          # 变速播放时的音调修正，默认 yes
 alang                  = auto         # 音轨首选语言，auto=匹配系统语言。MPV优先加载外挂轨道，此项实际用处不大
 audio-file-auto        = fuzzy        # <默认no|exact|fuzzy|all> 自动加载同名外挂音轨


 ########
 # 视频 #
 ########

##⇘⇘音视频同步模式
 video-sync                  = audio             # 默认值 audio 兼容性最好。display-resample=帧速率重采样匹配刷新率（增加开销）
#video-sync-max-video-change = 5                 # [当 --video-sync=display-xxxx 时生效] 超过阈值临时禁用，不建议超过 5
#interpolation               = no                # [当 --video-sync=display-xxxx 时生效] 减少帧率与刷新率不匹配的颤动
#tscale                      = oversample        # [当 --interpolation=yes 时生效] 时间插值算法（帧混合）

##⇘⇘“画质”相关
 cscale                      = lanczos           # 色度还原算法。不设定则自动采用 --scale 的值
 scale                       = lanczos           # 放大算法，默认值 lanczos
 dscale                      = bicubic           # 缩小算法。默认值 hermite
##所有可用的内置算法参见手册

#linear-upscaling            = no                # [须 16位及以上精度；与 --sigmoid-upscaling 不兼容] 默认 no
 sigmoid-upscaling           = yes               # [与 --linear-upscaling 不兼容] 放大时非线性的颜色转换，避免强振铃伪影
 linear-downscaling          = yes               # [须 16位及以上精度] 缩小时线性处理，提升颜色对比度精确性
 correct-downscaling         = yes               # [当 --dscale=bilinear 时无效] 削弱缩小处理产生的锯齿

 dither-depth                = no                # <N|no|默认auto> 色深抖动弥补色彩转换损失，auto不一定正确
#dither                      = fruit             # <默认fruit|ordered|error-diffusion|no> 色深抖动的算法
#deband                      = no                # 去色带，默认 no。可能受硬解码影响实际效果
 deinterlace                 = no                # 反交错。auto=自动检测

##⇘⇘背景填充
 background-tile-color-0 = "#B4B4B4"            # 背景棋盘格颜色 1（视频黑边/空白区域的填充色）
 background-tile-color-1 = "#DCDCDC"            # 背景棋盘格颜色 2（与颜色1交替形成棋盘格图案）
 background-tile-size    = 128                  # 棋盘格每格的像素大小

##⇘⇘色彩管理 —— 不具备该领域丰富知识不建议触碰。只想避免广色域屏过饱和，可仅修改 --target-prim
 icc-profile-auto            = no                # 自动校色，默认 no。专业校色后应开启
#icc-profile                 =                   # 加载指定的ICC，与前项不共存。例值 "X:/xxx/xxxx.icm"
#icc-3dlut-size              = auto              # <2-512> ICC生成的3D LUT大小，默认 auto
#icc-force-contrast          = no                # <默认no|0-1000000|inf> 强制指定ICC静态对比度。OLED 建议 1000000 或 inf

 target-prim                 = auto              # [不与 --icc-* 一起使用] 视频颜色将适应此颜色空间。99% argb屏→adobe，90%+ P3屏→display-p3
#tone-mapping                = bt.2390           # HDR→SDR色调映射算法
#target-peak                 = 1000              # 显示屏实际亮度（尼特）
 target-trc                  = auto              # [不与 --icc-* 一起使用] 传输特性。一般显示器用 gamma2.2


 ####################
 # 脚本 滤镜 着色器 #
 ####################

##⇘⇘内置脚本开关
 load-stats-overlay      = no   # 【stats.lua】 禁用内置统计信息（避免与 ModernX UI 冲突）
 load-auto-profiles      = yes  # 【auto_profiles.lua】 <yes|no|默认auto> 新版条件配置预设
 osc                     = no   # 【osc.lua】 禁用原生OSC（WinUI 自带控制条）
load-console             = no   # 【console.lua】已改用 scripts/console.lua（WinUI 风格菜单），禁用内置
#load-commands           = yes  # 【commands.lua】 OSD命令行，默认 yes
load-select              = no   # 【select.lua】已改用 scripts/select.lua 中文版，禁用内置英文版
#load-context-menu       = no   # 【context_menu.lua】 上下文菜单OSD版，Win平台默认no（已有原生菜单）
#load-positioning        = yes  # 【positioning.lua】 辅助移动图像位置，默认 yes

 ytdl                    = yes  # 【ytdl_hook.lua】 网址解析增强，默认 yes
 ytdl-raw-options-append = sub-langs=-danmaku
                                # [当 --ytdl=yes 时有效] 将自定义的选项传递给ytdl

##⇘⇘外置脚本开关
 load-scripts = yes # 自动挂载 /scripts/ 目录中的所有外置脚本，默认 yes
#scripts      = "~~/scripts/xxxxx.lua;~~/scripts/yyyyy.lua"

##⇘⇘滤镜部分
##更多实用向的滤镜参考 https://github.com/hooke007/mpv_PlayKit/discussions/120
#vf-append = @vsr:d3d11vpp=format=nv12:scale=4:scaling-mode=nvidia # 手动开启NVIDIA VSR超分（通过右键菜单控制）
# RTX Video HDR：已改由 hdr_auto.lua 自动检测屏幕 HDR 支持并挂载 @hdr（右键菜单可手动切换）

##⇘⇘着色器部分
##具体的着色器信息参见 https://github.com/hooke007/mpv_PlayKit/wiki/4_GLSL
#glsl-shaders-append     = "" # 启动时默认加载的着色器
#glsl-shader-opts-append = QCOM_SGEDS_ms_RT/STR=2.0

 ########
 # 字幕 #
 ########

 sub-auto                       = fuzzy       # <no|默认exact|fuzzy|all> 自动加载同名外挂字幕
 sub-file-paths                 = sub;Subs;subtitles
                                              # 在指定的额外目录中寻找匹配的字幕。支持相对和绝对路径
 sub-codepage                   = auto        # 指定文本类字幕文件的代码页。auto 自动检测，兼容性最好
 slang                          = chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze
                                              # 字幕首选语言。MPV优先加载外挂轨道，此项实际用处不大
#subs-fallback                  = default     # <yes|默认default|no> 无匹配首选语言时是否回退。default=仅选默认标记轨道

#blend-subtitles                = no          # <yes|video|默认no> 混合字幕到视频帧。会将字幕限制在视频可见部分
 sub-hdr-peak                   = 100         # <默认sdr|10-10000> 文本类字幕在hdr输出中的白点亮度，默认sdr等效203
#sub-font-provider              = auto        # <默认auto|none|fontconfig> 字幕字体提供程序

##⇘⇘纯文本字幕部分 —— SRT LRC
 sub-font                       = "sans-serif"    # 默认 sans-serif，可在设置中选择字体
                                              # 指定文本字幕的默认字体名（不是文件名），默认 sans-serif
 sub-font-size                  = 38          # 纯文本字幕的尺寸
 sub-color                      = "#ffffff"   # <格式为(AA)RRGGBB> 字体主体颜色
#sub-back-color                 = "#641C1C1C" # <格式为(AA)RRGGBB> 纯文本字幕背景色
#sub-shadow-offset              = 2           # 阴影偏移
 sub-outline-size               = 1.5         # 描边尺寸（减小以消除厚黑边）
 sub-blur                       = 0           # 阴影模糊（关闭以消除晕染）
 sub-scale-signs                = yes         # 缩放特殊符号
 sub-use-margins                = yes         # 是否使纯文本字幕输出在黑边上，默认 yes

##⇘⇘高级字幕部分 —— SSA ASS
#sub-ass-override               = force       # <no|yes|默认scale|force|strip> 是否覆盖字幕脚本原始样式
#sub-ass-scale-with-window      = yes         # 字幕随窗口缩放，默认 no
#embeddedfonts                  = yes         # 是否使用mkv容器内嵌字体，默认 yes
 sub-ass-force-margins          = yes         # [当 --blend-subtitles=yes/video 时无效] 使ASS字幕尽可能输出在黑边上
#sub-ass-style-overrides        = Fontname=Source Han Sans SC
                                              # 使用自定义参数覆盖字幕文件内的预设
##⇘⇘模拟vsfilter相关
#sub-ass-use-video-data         = aspect-ratio # <none|aspect-ratio|默认all> 控制传递给libass的视频流信息
#sub-ass-video-aspect-override  = 16:9        # 覆盖向libass传递指定的宽高比，默认 no
#sub-ass-vsfilter-color-compat  = basic       # <默认basic|full|force-601|no> 字幕色彩空间处理

##⇘⇘图形字幕部分 —— IDX SUB SUP
 image-subs-hdr-peak            = 10000       # <默认sdr|video|10-10000> 图形字幕在hdr输出中的白点亮度
#stretch-image-subs-to-screen   = yes         # 拉伸图形字幕到缩放分辨率，可使PGS输出在黑边
#image-subs-video-resolution    = yes         # 使用视频分辨率覆盖图形字幕的原始分辨率，默认 no


 ########
 # 截图 #
 ########

 screenshot-format             = png  # <默认 jpg|jpeg|png|webp|jxl|avif>

##更多其它格式对应的关联选项参见官方手册
## https://mpv.io/manual/master/#options-screenshot-webp-lossless
## https://mpv.io/manual/master/#options-screenshot-avif-encoder
 screenshot-jpeg-quality       = 100  # <0-100> JPEG的质量，默认 90
#screenshot-jpeg-source-chroma = yes  # 用与源视频相同的色度半采样写入JPEG，默认 yes
 screenshot-png-compression    = 4    # <0-9> PNG压缩等级，过高的等级影响性能，默认 7
#screenshot-png-filter         = 5    # <0-5> PNG的压缩过滤器，默认值 5 即可实现最佳压缩率
#screenshot-webp-lossless      = yes  # WebP 无损模式
#screenshot-webp-quality       = 100
#screenshot-webp-compression   = 0
 screenshot-jxl-distance       = 0    # <0-15> JXL的视觉模型距离，0=质量无损，默认值1
#screenshot-jxl-effort         = 4    # <1-9> JXL压缩等级，默认 4

 screenshot-tag-colorspace     = yes  # 使用适当的色彩空间标记截图（并非所有格式受支持），默认 yes
 screenshot-high-bit-depth     = no   # 尽可能使用高位深作截屏（可能导致巨大文件体积），默认 yes
 screenshot-template           = "MPV-%P-N%n"
                                      # 截图命名模板。示例即默认值"mpv-shot%n"，可额外选填路径
 screenshot-dir                = "~~desktop"
                                      # [若已在截图命名模板中设置路径则无需使用] 默认为空
