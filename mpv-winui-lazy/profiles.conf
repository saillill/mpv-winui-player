### 文档_ https://github.com/hooke007/mpv_PlayKit/blob/main/portable_config/profiles.conf

 ##############
 # 配置预设组 #
 ##############

[speed_limit1]
 profile-desc = 速度变化下限的控制
 profile-cond = p.speed<0.1
 speed = 0.1


[speed_limit2]
 profile-desc = 速度变化上限的控制
 profile-cond = p.speed>8
 speed = 8


[ontop_playback]
 profile-desc = 基于播放状态的自动置顶
#profile-cond = not pause and not p.idle_active   # 未自动启用
 profile-restore = copy
 ontop = yes


## https://github.com/mpv-player/mpv/issues/11122
[vsync_auto]
 profile-desc = 基于帧率或垂直同步率或速率的自动视频同步
 profile-cond = p.container_fps and p.display_fps and (p.container_fps>32 or (p.display_fps/p.container_fps)>3.2 or p.speed~=1)
 profile-restore = copy
 interpolation = no
 video-sync = audio


[deband_bitrate]
 profile-desc = 基于码率的自动去色带
 profile-cond = p.file_size and p.duration and ((p.file_size/1024)*8)/p.duration<=3000
 profile-restore = copy
 deband = yes


[save_props_auto]
 profile-desc = 基于进度或时长或视频轨类型的自动保存属性
 profile-cond = (p.percent_pos or 0)>=90 or (p.duration or 301)<=300 or not vid or p["current-tracks/video/albumart"] or p["current-tracks/video/image"]
 profile-restore = copy
 save-position-on-quit = no


[HDR_generic]
 profile-desc = hdr通用
 profile-cond = (p["video-params/sig-peak"] or 0) > 1
 profile-restore = copy
 blend-subtitles = no
#tone-mapping = hable
#gamut-mapping-mode = clip
 hdr-reference-white = 100
 hdr-peak-percentile = 99.99
#target-peak = 100
#sub-color = 0.7
#sub-border-color = 0.1
#sub-back-color = "#00000000"
#sub-shadow-offset = 0


# ---- WinUI 嵌入：按 App 报告的显示器状态切换输出色彩空间（作者 README 同款方案）----
[mpvw-sdr]
profile-desc = WinUI 嵌入：SDR 显示器
profile-cond = p["user-data/mpvw/color-kind"] == "SDR"
profile-restore = copy
d3d11-output-csp=srgb
d3d11-output-format=rgb10_a2

[mpvw-wcg]
profile-desc = WinUI 嵌入：广色域显示器
profile-cond = p["user-data/mpvw/color-kind"] == "WCG"
profile-restore = copy
d3d11-output-csp=bt.2020
d3d11-output-format=rgb10_a2

# composition 模式下 mpv 拿不到显示器信息，必须显式指定目标色彩空间，
# 否则即使交换链是 PQ，渲染内容和逐帧 hint 仍按 SDR 走，驱动不会进入 HDR。
[mpvw-hdr]
profile-desc = WinUI 嵌入：HDR 显示器
profile-cond = p["user-data/mpvw/color-kind"] == "HDR"
profile-restore = copy
d3d11-output-csp=pq
d3d11-output-format=rgb10_a2
target-trc=pq
target-prim=bt.2020
target-peak=1000
