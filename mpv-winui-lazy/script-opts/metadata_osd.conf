## metadata_osd. 示例配置文件。
## 默认值已预先填好并被注释掉了。

#-- 在 mpv 启动时启用 OSD
enable_on_start=yes

#-- 为不同轨道启用 OSD
enable_for_audio=yes
enable_for_audio_withalbumart=yes
enable_for_video=no
enable_for_image=no

#-- 启用 OSD-2（如果存在章节标题元数据）
enable_osd_2=yes

#-- 启用路径名后备（Fallback）机制
enable_pathname_fallback_dirnameup=yes
enable_pathname_fallback_dirname=yes
enable_pathname_fallback_filename=yes

#-- 为不同轨道自动隐藏 OSD
autohide_for_audio=no
autohide_for_audio_withalbumart=no
autohide_for_video=yes
autohide_for_image=yes

#-- 自动隐藏延迟（秒）
autohide_timeout_sec=5
autohide_statusosd_timeout_sec=5

#-- 按键绑定

#-- 主启用/禁用键（一键总开关）
#key_toggleenable=F1

#-- 启用/禁用 OSD 自动隐藏功能的按键
#key_toggleautohide=F5

#-- 显示/隐藏 OSD-1 的按键
#--   - 应用当前的自动隐藏状态，因此如果启用了自动隐藏，OSD 将在指定的延迟后再次隐藏
#key_toggleosd_1=

#-- 显示/隐藏 OSD-2 的按键（如果存在章节标题元数据）
#--   - 应用当前的自动隐藏状态（同上）
#--   - 需要通过 'enable_osd_2' 配置项启用 OSD-2
#--   - OSD-2 需要存在数据内容
#key_toggleosd_2=

#-- 重置任何用户切换的开关
#key_reset_usertoggled=F6

#-- 显示状态 OSD 的按键
#--   - 显示 OSD 和自动隐藏的状态（已启用 / 已禁用）
#key_showstatusosd=

#-- 最大 OSD 消息长度
#--   OSD 消息将在指定的（字符）长度后被截断。
#osd_message_maxlength=96

#-- 默认 OSD-1 布局和内容：
#-- ┌─────────────────┐
#-- │ padding top     │ (顶部内边距)
#-- ├─────────────────┤
#-- │ TEXT AREA 1     │ (文本区域 1)
#-- ├─────────────────┤
#-- │ padding top     │ (顶部内边距)
#-- ├─────────────────┼─────────────────────┐
#-- │ TEXT AREA 2     │ TEXT AREA 2 RELDATE │ (文本区域 2 | 文本区域 2 发行日期)
#-- ├─────────────────┼─────────────────────┘
#-- │ padding top     │ (顶部内边距)
#-- ├─────────────────┤
#-- │ TEXT AREA 3     │ (文本区域 3)
#-- ├─────────────────┤
#-- │ padding top     │ (顶部内边距)
#-- ├─────────────────┤
#-- │ TEXT AREA 4     │ (文本区域 4)
#-- └─────────────────┘

#-- ===================== ========================= ======================
#--  布局元素              填充的元数据               （用于在线内容）
#-- ===================== ========================= ======================
#--  TEXT AREA 1           Artist (艺术家)           < 空 >
#--  TEXT AREA 2           Album (专辑)              Uploader (上传者)
#--  TEXT AREA 2 RELDATE   Release Year (发行年份)   < 空 >
#--  TEXT AREA 3           Title (标题)              Media Title /File Date Tags/ (媒体标题/文件日期标签/)
#--  TEXT AREA 4           Playlist Position /       <-- (同左)
#--                        Playlist Count (播放列表位置/总数)
#-- ===================== ========================= ======================

#-- ===================== =========================
#--  布局元素              路径名后备
#-- ===================== =========================
#--  TEXT AREA 1           Directory name (one above) (上一级目录名)
#--  TEXT AREA 2           Directory name (当前目录名)
#--  TEXT AREA 2 RELDATE   <not applied> (不适用)
#--  TEXT AREA 3           File name (文件名)
#--  TEXT AREA 4           <not applied> (不适用)
#-- ===================== =========================

#-- 默认 OSD-2 布局和内容：
#-- ┌─────────────────┐
#-- │ padding top     │ (顶部内边距)
#-- ├─────────────────┤
#-- │ TEXT AREA 1     │ (文本区域 1)
#-- └─────────────────┘

#--  ================= ======================
#--   布局元素          填充的元数据
#--  ================= ======================
#--   TEXT AREA 1       Chapter Title (章节标题)
#--  ================= ======================

#-- 样式选项

#-- 样式：顶部内边距（以半行的数量计算）
#-- 允许的值为以下范围内的整数：
#--   0, 1, .. 40
#style_paddingtop_osd_1_textarea_1=1
#style_paddingtop_osd_1_textarea_2=0
#style_paddingtop_osd_1_textarea_3=2
#style_paddingtop_osd_1_textarea_4=3
#style_paddingtop_osd_2_textarea_1=3

#-- 样式：对齐方式
#-- 值可以是字符串（多个值用分号 ';' 分隔）：
#--   left_justified (左对齐) 或 centered (居中) 或 right_justified (右对齐) ';' subtitle (底部字幕) 或 midtitle (中部字幕) 或 toptitle (顶部字幕)
#style_alignment_osd_1=left_justified;midtitle
#style_alignment_osd_2=centered;midtitle

#-- 样式：字体样式覆盖
#-- 值可以是字符串（多个值用分号 ';' 分隔）：
#--   italic (斜体) ';' bold (粗体)
#style_fontstyle_osd_1_textarea_1=bold
#style_fontstyle_osd_1_textarea_2=bold
#style_fontstyle_osd_1_textarea_2_releasedate=
#style_fontstyle_osd_1_textarea_3=italic
#style_fontstyle_osd_1_textarea_4=
#style_fontstyle_osd_2_textarea_1=

#-- 样式：文本周围轮廓的边框宽度
#-- 允许的值为整数：
#--   0, 1, 2, 3 或 4
style_bord_osd_1=1
style_bord_osd_2=1

#-- 样式：文本的阴影深度
#-- 允许的值为整数：
#--   0, 1, 2, 3 或 4
style_shad_osd_1_textarea_1=0
style_shad_osd_1_textarea_2=0
style_shad_osd_1_textarea_3=0
style_shad_osd_1_textarea_4=0
style_shad_osd_2_textarea_1=0

#-- 样式：字体缩放（百分比）
#-- 允许的值为以下范围内的整数：
#--   10, 11, .. 400
#style_fsc_osd_1_textarea_1=100
#style_fsc_osd_1_textarea_2=100
#style_fsc_osd_1_textarea_3=100
#style_fsc_osd_1_textarea_4=60
#style_fsc_osd_2_textarea_1=100

#-- 样式：字母间距
#-- 允许的值为以下范围内的整数：
#--   0, 1, .. 40
#style_fsp_osd_1_textarea_1=0
#style_fsp_osd_1_textarea_2=0
#style_fsp_osd_1_textarea_3=10
#style_fsp_osd_1_textarea_4=0
#style_fsp_osd_2_textarea_1=0

#-- 当前章节号

#-- 除了当前的播放列表位置外，还显示当前的章节号。
#--   这对于内部包含章节且每个章节是一首歌的音频文件（也）很有用。

#-- 如果激活了该设置（见下文），当前的播放列表位置将下移一行并放在方括号内。
#-- 例如：
#--   Chapter: 4/16
#--   [1/5]            <-- 播放列表位置

#-- 如果章节号等于当前的播放列表位置，该值将与播放列表位置合并（以避免重复）。
#-- ^ (换言之) 仅在不等于当前播放列表位置时应用。

#-- 如果播放列表只包含一个媒体，则省略播放列表位置，并替换为章节号。

#show_chapternumber=no

#-- 当前专辑音轨号

#-- 除了（包含的）播放列表位置外，还显示当前专辑的音轨号（如果元数据中存在）。
#--   如果播放列表跨越多个目录，这可能会很有用。

#-- 如果激活了该设置（见下文），当前的播放列表位置将下移一行并放在方括号内。
#-- 例如：
#--   Track: 3
#--   [4/26]            <-- 播放列表位置

#-- 如果音轨号等于当前的播放列表位置，该值将与播放列表位置合并（以避免重复）。
#-- ^ (换言之) 仅在不等于当前播放列表位置时应用。

#-- 如果播放列表只包含一个媒体，则省略播放列表位置，并替换为专辑音轨号。

#-- _注意_：专辑音轨号很少存在于元数据中，这可能会产生好坏参半的结果。

#show_albumtracknumber=no

