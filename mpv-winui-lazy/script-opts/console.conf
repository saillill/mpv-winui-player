# console.lua 选项（select 菜单 / 输入框等 OSD 界面）
# 颜色不再由此文件控制：scripts/console.lua 会自动读取 Windows 深浅色主题，
# 菜单跟随系统使用黑白配色（WinUI 风格）。这里只保留字号/间距/圆角。
# 4K 下原默认 font_size=24 / border_size=1.65 / gap=0.2 会随窗口放大，
# 字号偏大、黑边偏粗、行距偏宽；这里整体调小。
font_size=12
border_size=0.6
gap=0.06
padding=6
background_alpha=0
menu_outline_size=1
menu_outline_color=#3C3C3C
corner_radius=6
focused_color=#FFFFFF
focused_back_color=#3C3C3C
match_color=#D0D0D0
scale_with_window=auto
