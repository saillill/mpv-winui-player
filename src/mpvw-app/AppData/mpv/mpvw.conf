### Logs
msg-level=all=error
log-file=~~/mpv.log

### Video
hwdec=auto
vo=gpu-next

### Audio
volume-max=100

### Subtitles
sub-auto=all
blend-subtitles=yes

### Playlist
directory-mode=recursive
prefetch-playlist=no
autocreate-playlist=filter
osd-playlist-entry=filename
directory-filter-types=video,audio,playlist

### OSD
# osd-level 和 osd-playing-msg 刻意不写在这里，而是由设置层写进托管块。
#
# 原因：这两个值是「代码拥有」的（ManagedMpvConfig.AlwaysAppOwnedOptions）。
# 写在 body 里会有两份定义，而托管块在 body 之后——mpv 由上往下读，块里的旧值
# 会盖掉这里的新值。实测过一个安装：body 写 0、块里残留旧构建的 1，结果是
# 0 从未生效，mpv 继续在画面上画自己的文字，和本应用的胶囊提示同时出现。
#
# 想要的语义是「mpv 不画任何文字」（0），由 MpvPlayerPage.Osd.cs 的胶囊接管
# 音量、暂停、循环和随机。把 0 写进界面设置即可，不要在这里加回来。
#
# 下面这几项只在用户把 osd-level 调回 1 以上时才生效，保留是为了那种情况下的观感。
osd-font-size=25
osd-outline-size=0
osd-shadow-offset=4
osd-back-color=0/0.5
osd-border-style=background-box

### Cache
cache=yes
demuxer-max-bytes=100MiB
demuxer-max-back-bytes=50MiB

### History
save-watch-history=no
watch-history-path=~~/history

### Watch Later
save-position-on-quit=no
watch-later-dir="~~/cache/watch_later"
write-filename-in-watch-later-config=yes
watch-later-options=start

### Screenshots
screenshot-format=png
screenshot-png-compression=6
screenshot-template="~~/screenshots/%F-(%P)-%n"

### yt-dlp
ytdl=yes
script-opt=ytdl_hook-all_formats=yes

### Key
input-default-bindings=no
input-media-keys=yes
media-controls=yes

### Net
curl-enabled=yes

### Disc
disc-menu=yes

###
#d3d11va-zero-copy="yes"

[mpvw-hdr]
profile-cond=p["user-data/mpvw/color-kind"] == "HDR"
profile-restore=copy
d3d11-output-format=rgb10_a2
target-colorspace-hint=yes
target-colorspace-hint-mode=source

[mpvw-wcg]
profile-cond=p["user-data/mpvw/color-kind"] == "WCG"
profile-restore=copy
d3d11-output-csp=srgb
d3d11-output-format=rgb10_a2

[mpvw-sdr]
profile-cond=p["user-data/mpvw/color-kind"] == "SDR"
profile-restore=copy
d3d11-output-csp=srgb
d3d11-output-format=rgb10_a2
