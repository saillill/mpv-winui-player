name: build

# Manual runs are kept for producing release artifacts. The push and
# pull_request triggers exist because the gates below (checks, tests, packaging)
# otherwise only ran when somebody remembered to press the button, which is how
# a settings value that grew mpv.conf to 896 MB per launch reached a release
# with the test suite sitting right there, never invoked.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-2025
    env:
      Appx_Package_Dir: ${{github.workspace}}\mpv-winui\Packages\
      # secrets 不能直接用于 if: 表达式（GitHub 解析期报 Unrecognized named-value），
      # 先经 env 提升，再用 env.X 判断。
      Pfx_Base64: ${{ secrets.BASE64_ENCODED_PFX }}
      Pfx_Key: ${{ secrets.Pfx_Key }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Check localization / menus.json schema
      run: python tools/check-localization.py

    - name: Check settings drift
      run: python tools/check-settings-drift.py

    - name: Check XAML
      # XAML cannot carry "--" inside a comment (WMC9997) and nothing in the
      # editing tooling prevents it. Documented as having cost this repo five
      # full build cycles, with a failed build still being deployed as success on
      # the fifth, and it was not in CI.
      run: python tools/check-xaml.py

    - name: Check generated settings are fresh
      # gen-schema-options.py --check existed and was never invoked by anything,
      # so the ~14k lines of *.Gen.cs in the tree were only ever re-generated
      # when somebody remembered.
      run: python tools/gen-schema-options.py --check

    - name: Download native deps
      # Was: two curl downloads piped straight into Expand-Archive, with no
      # integrity check, feeding binaries that end up in a signed MSI. The
      # script verifies the sha256 published on each upstream release page and
      # installs the per-architecture layout the projects resolve.
      shell: pwsh
      run: .\tools\fetch-mpv-libs.ps1 -Root . -Platform ${{ matrix.platform }}

    # Optional code-signing: only runs when both secrets are configured.
    # A fresh fork without secrets still gets the unpackaged Release zip.
    #
    # Moved above Update Package because that script needs the publisher below,
    # and it now also derives the publisher rather than relying on the manifest's
    # development identity being edited by hand.
    - name: Decode the pfx and derive the package publisher
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
        $certificatePath = "GitHubActionsWorkflow.pfx"
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

        # Identity.Publisher must equal the signing certificate's subject or
        # Windows refuses to install the package (0x80073CF0). The value in the
        # repository is the development identity, which is right for sideloading
        # and wrong here, so it is taken from the certificate that will actually
        # sign the package instead of being kept in sync by hand.
        $pw = ConvertTo-SecureString -String "${{ secrets.Pfx_Key }}" -AsPlainText -Force
        $subject = (Get-PfxCertificate -FilePath $certificatePath -Password $pw).Subject
        Write-Host "signing certificate subject: $subject"
        "APPX_PUBLISHER=$subject" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Update Package
      run: |
        $env:VERSION_BUILD_NUMBER = "${{github.run_number}}"
        .\update-package.ps1

    - name: Restore nuget
      # packages.config restore, needed before the C++ component builds.
      run: |
        nuget restore  mpv-winui\mpv-winrt\mpv-winrt.vcxproj  -SolutionDirectory mpv-winui
        nuget restore  mpv-winui\mpv-winui\mpv-winui.csproj  -SolutionDirectory mpv-winui
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Build the C++ component
      # Built explicitly, the way build.ps1 does it. The publish step below would
      # build it too, but as an implicit side effect of a step that also produces
      # the artifact, which left nowhere for the tests to run before packaging.
      shell: pwsh
      run: msbuild mpv-winui\mpv-winrt\mpv-winrt.vcxproj /t:Build /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:VisualStudioVersion=17.0 /m /v:m /nologo
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Test
      # Neither suite ran in CI before. mpv-conf-test was invoked by build.ps1
      # only, and mpv-winrt-test by nothing at all, because its test class
      # referenced app code through a Compile link that had never been added and
      # so the project did not compile.
      shell: pwsh
      run: |
        dotnet test mpv-winui\mpv-conf-test\mpv-conf-test.csproj -c $env:Configuration -v:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        dotnet test mpv-winui\mpv-winrt-test\mpv-winrt-test.csproj -c $env:Configuration -p:Platform=$env:Platform -v:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Create Unpackaged
      run: msbuild mpv-winui\mpv-winui\mpv-winui.csproj /t:Publish /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:BuildMpvWinrtWithReference=true /p:GenerateAppxPackageOnBuild=false /p:AppxPackageSigningEnabled=false
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Create Package
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      run: msbuild mpv-winui\mpv-winui\mpv-winui.csproj /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:BuildMpvWinrtWithReference=true /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:PackageCertificateKeyFile=${{env.CertFile}} /p:PackageCertificatePassword=${{ secrets.Pfx_Key }} /p:AppxPackageDir="$env:Appx_Package_Dir" /p:GenerateAppxPackageOnBuild=true
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: SideloadOnly
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}
        CertFile: ${{github.workspace}}\GitHubActionsWorkflow.pfx

    - name: Remove the pfx
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      run: Remove-Item -path GitHubActionsWorkflow.pfx -ErrorAction SilentlyContinue

    - name: Create Release Zip
      shell: pwsh
      run: .\package.ps1 -Configuration $env:Configuration -Platform $env:Platform -SkipPublish
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Install WiX v5
      shell: pwsh
      run: dotnet tool install --global wix --version 5.*

    - name: Create MSI
      shell: pwsh
      run: |
        $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
        .\installer\build-installer.ps1 -Configuration $env:Configuration -Platform $env:Platform -SkipPublish -Version "1.0.${{github.run_number}}"
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Upload MSI
      uses: actions/upload-artifact@v7
      with:
        name: mpv-winui-msi-${{ matrix.platform }}
        path: ${{github.workspace}}\dist\mpv-winui-setup-*.msi

    - name: Upload Deps
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      uses: actions/upload-artifact@v7
      with:
        name: mpvw-deps-${{ matrix.platform }}
        archive: true
        path: |
          ${{env.Appx_Package_Dir}}\*\Dependencies\${{ matrix.platform }}\*

    - name: Upload Package
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      uses: actions/upload-artifact@v7
      with:
        name: mpvw-msix-${{ matrix.platform }}-${{ matrix.configuration }}
        archive: true
        path: |
          ${{env.Appx_Package_Dir}}\*\*.msix
          ${{env.Appx_Package_Dir}}\*\*.cer

    - name: Upload Unpackaged
      uses: actions/upload-artifact@v7
      with:
        name: mpvw-unpackaged-${{ matrix.platform }}-${{ matrix.configuration }}
        archive: true
        path: ${{github.workspace}}\mpv-winui\mpv-winui\bin\win-${{ matrix.platform }}\publish

    - name: Upload App Data Sample
      uses: actions/upload-artifact@v7
      with:
        name: mpvw-app-data-sample
        archive: true
        path: ${{github.workspace}}\data

    - name: Upload Release Zip
      uses: actions/upload-artifact@v7
      with:
        name: mpv-winui-release-${{ matrix.platform }}-${{ matrix.configuration }}
        path: ${{github.workspace}}\dist\mpv-winui-win-${{ matrix.platform }}-${{ matrix.configuration }}.zip
