name: build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-2025
    env:
      Appx_Package_Dir: ${{github.workspace}}\mpv-winui\Packages\
      # secrets 不能直接用于 if: 表达式（GitHub 解析期报 Unrecognized named-value），
      # 先经 env 提升，再用 env.X 判断。
      Pfx_Base64: ${{ secrets.BASE64_ENCODED_PFX }}
      Pfx_Key: ${{ secrets.Pfx_Key }}

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3

    - name: Check localization / menus.json schema
      run: python tools/check-localization.py

    - name: Check settings drift
      run: python tools/check-settings-drift.py

    - name: Download mpv libs
      run: |
        curl -L -o mpv-libs.zip "https://github.com/ikas-mc/mpv-windows-builder/releases/download/20260731/mpv-2.dll.zip"
        Expand-Archive -Path mpv-libs.zip -DestinationPath "${{github.workspace}}\mpv-winui\libs" -Force
        Remove-Item -Path mpv-libs.zip -Force

    - name: Update Package
      run: |
        $env:VERSION_BUILD_NUMBER = "${{github.run_number}}"
        .\update-package.ps1

    - name: Restore nuget
      run: |
        nuget restore  mpv-winui\mpv-winrt\mpv-winrt.vcxproj  -SolutionDirectory mpv-winui
        nuget restore  mpv-winui\mpv-winui\mpv-winui.csproj  -SolutionDirectory mpv-winui
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    # Optional code-signing: only runs when both secrets are configured.
    # A fresh fork without secrets still gets the unpackaged Release zip.
    - name: Decode the pfx
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
        $certificatePath = "GitHubActionsWorkflow.pfx"
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    - name: Create Unpackaged
      run: msbuild mpv-winui\mpv-winui\mpv-winui.csproj /t:Publish /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:BuildMpvWinrtWithReference=true /p:GenerateAppxPackageOnBuild=false /p:AppxPackageSigningEnabled=false
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Create Package
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      run: msbuild mpv-winui\mpv-winui\mpv-winui.csproj /p:Configuration=$env:Configuration /p:Platform=$env:Platform /p:BuildMpvWinrtWithReference=true /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode /p:AppxBundle=$env:Appx_Bundle /p:PackageCertificateKeyFile=${{env.CertFile}} /p:PackageCertificatePassword=${{ secrets.Pfx_Key }} /p:AppxPackageDir="$env:Appx_Package_Dir" /p:GenerateAppxPackageOnBuild=true
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: SideloadOnly
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}
        CertFile: ${{github.workspace}}\GitHubActionsWorkflow.pfx

    - name: Remove the pfx
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      run: Remove-Item -path GitHubActionsWorkflow.pfx -ErrorAction SilentlyContinue

    - name: Create Release Zip
      shell: pwsh
      run: .\package.ps1 -Configuration $env:Configuration -Platform $env:Platform -SkipPublish
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Install WiX v5
      shell: pwsh
      run: dotnet tool install --global wix --version 5.*

    - name: Create MSI
      shell: pwsh
      run: |
        $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
        .\installer\build-installer.ps1 -Configuration $env:Configuration -Platform $env:Platform -SkipPublish -Version "1.0.${{github.run_number}}"
      env:
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}

    - name: Upload MSI
      uses: actions/upload-artifact@v7
      with:
        name: mpv-winui-msi-${{ matrix.platform }}
        path: ${{github.workspace}}\dist\mpv-winui-setup-*.msi

    - name: Upload Deps
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      uses: actions/upload-artifact@v7
      with:
        name: mpv-winui-Deps-${{ matrix.platform }}
        archive: true
        path: |
          ${{env.Appx_Package_Dir}}\*\Dependencies\${{ matrix.platform }}\*

    - name: Upload Package
      if: env.Pfx_Base64 != '' && env.Pfx_Key != ''
      uses: actions/upload-artifact@v7
      with:
        name: mpv-winui-${{ matrix.platform }}-${{ matrix.configuration }}
        archive: true
        path: |
          ${{env.Appx_Package_Dir}}\*\*.msix
          ${{env.Appx_Package_Dir}}\*\*.cer

    - name: Upload Unpackaged
      uses: actions/upload-artifact@v7
      with:
        name: mpv-winui-unpackaged-${{ matrix.platform }}-${{ matrix.configuration }}
        path: ${{github.workspace}}\mpv-winui\mpv-winui\bin\win-${{ matrix.platform }}\publish

    - name: Upload Release Zip
      uses: actions/upload-artifact@v7
      with:
        name: mpv-winui-release-${{ matrix.platform }}-${{ matrix.configuration }}
        path: ${{github.workspace}}\dist\mpv-winui-win-${{ matrix.platform }}-${{ matrix.configuration }}.zip
